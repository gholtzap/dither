name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test
        run: cargo test --workspace

      - name: Build universal binary
        run: |
          cargo build --release -p dither --target aarch64-apple-darwin
          cargo build --release -p dither --target x86_64-apple-darwin

      - name: Package application
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="dist/Dither.app"
          mkdir -p "$app/Contents/MacOS"
          lipo -create \
            target/aarch64-apple-darwin/release/dither \
            target/x86_64-apple-darwin/release/dither \
            -output "$app/Contents/MacOS/Dither"
          chmod +x "$app/Contents/MacOS/Dither"
          plutil -create xml1 "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string en" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Dither" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string Dither" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.gholtzap.dither" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string Dither" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $version" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $version" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 11.0" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo "$app/Contents/MacOS/Dither" -verify_arch arm64 x86_64
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/Dither-macOS-universal.zip
          cd dist
          shasum -a 256 Dither-macOS-universal.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/Dither-macOS-universal.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/Dither-macOS-universal.zip dist/SHA256SUMS.txt \
              --verify-tag --generate-notes --title "Dither $GITHUB_REF_NAME"
          fi
